<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wetter-Tool – Entwurf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="meteogramm.css?v=20260926a">
<style>
  /* ---- Seite (wie die Fuerteventura-Seite) ---- */
  :root { color-scheme: dark; --page:#14181a; --surface:#1b2124; --surface-2:#202729; --border:#303836; --ink:#ede9e0; --ink-dim:#b4ac9c; --teal:#4bc4cb; --ochre:#e0a24f; }
  :root[data-theme="light"] { color-scheme: light; --page:#e9ebe6; --surface:#f8f8f4; --surface-2:#eeeee6; --border:#d7d6c9; --ink:#1c1a17; --ink-dim:#5b564c; --teal:#0f6e76; --ochre:#b5741f; }
  body { margin:0; background:var(--page); color:var(--ink); font:15px/1.5 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif; }
  .seite { max-width:760px; margin:0 auto; padding:16px 20px 80px; }
  .seite.vergleich { max-width:1500px; }
  h1 { font-size:1.25rem; margin:0 0 2px; }
  .unter { color:var(--ink-dim); font-size:13px; margin:0 0 12px; }

  /* ---- Schalterleiste des Labors ---- */
  .regler { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin:0 0 14px; font-size:12.5px; color:var(--ink-dim); }
  .regler .gruppe { display:inline-flex; align-items:center; gap:6px; }
  .regler .seg { display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:2px; }
  .regler button { min-height:32px; padding:0 10px; border:0; border-radius:8px; background:transparent; color:var(--ink-dim); font:600 12.5px "Plus Jakarta Sans", system-ui, sans-serif; cursor:pointer; }
  .regler button.is-on { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.18); }

  /* minmax(0, …): sonst misst das Raster die Spalte am breiten Diagramm und die
     Karte wächst auf mehrere tausend Pixel. */
  .labor { display:grid; gap:20px; grid-template-columns:minmax(0,1fr); }
  .labor > * { min-width:0; }
</style>
</head>
<body>
<div class="seite" id="seite">
  <h1>Wetter-Tool – Entwurf</h1>
  <p class="unter">Entschieden am 25.09.2026 und fest im Baustein: Bild unten, Werte am Strich, Knöpfe unten, Datumsfahne bleibt oben stehen.</p>

  <div class="regler">
    <span class="gruppe"><span class="seg" data-schalter="thema"><button data-wert="dunkel">dunkel</button><button data-wert="hell">hell</button></span></span>
  </div>

  <div class="labor" id="labor">
    <div><div id="wetter-a"></div></div>
  </div>
</div>

<script src="meteogramm.js?v=20260926a"></script>
<script>
  var EINST = {
    zeitzone: 'Atlantic/Canary', merkschluessel: 'fuerte-mg',
    bildspeicher: 'https://fuerte-sync.stephanhandel.workers.dev',
    orte: [
      { id:'corralejo', name:'Corralejo',  lat:28.7297, lon:-13.8672, meer:{ lat:28.7297, lon:-13.8672 } },
      { id:'cotillo',   name:'El Cotillo', lat:28.6855, lon:-14.0110, meer:{ lat:28.69,   lon:-14.03   } },
      { id:'sotavento', name:'Sotavento',  lat:28.1560, lon:-14.2275, meer:{ lat:28.145,  lon:-14.21   } }
    ],
    zeilen: ['sonne','temp','wind','regen','uv','feuchte','wolken','welle','tide','druck'],
    zeilenStandard: ['sonne','temp','wind','regen','uv','welle','tide'],
    kameras: {
    corralejo: {
      name: 'Grandes Playas, Corralejo',
      live: 'https://cdn.skylinewebcams.com/live6086.jpg',
      quelle: 'SkylineWebcams',
      seite: 'https://www.skylinewebcams.com/en/webcam/espana/canarias/corralejo/grandes-playas-corralejo.html'
    },
    cotillo: {
      id: 'cotillo', name: 'El Cotillo, Hafen',
      live: 'https://www.meteosurfcanarias.com/1-webcams/webcam-el-cotillo.jpg',
      quelle: 'MeteoSurf Canarias',
      seite: 'https://www.meteosurfcanarias.com/webcams/new/de/strand-webcams-insel_fuerteventura.php'
    },
    // Zwei Kameras: eine direkt am Sotavento-Strand, eine am Leuchtturm von Jandía
    sotavento: [
      { id: 'sotavento', name: 'Sotavento, Playa Barca',
      live: 'https://i.ytimg.com/vi/8CxYZ4tPTmo/maxresdefault_live.jpg',
      quelle: 'René Egli · YouTube', seite: 'https://www.youtube.com/watch?v=8CxYZ4tPTmo' },
      { id: 'jandia', name: 'Faro de Jandía, Morro Jable',
      live: 'https://www.meteosurfcanarias.com/1-webcams/webcam-faro-jandia.jpg',
      quelle: 'MeteoSurf Canarias', seite: 'https://www.meteosurfcanarias.com/webcams/new/de/strand-webcams-insel_fuerteventura.php' }
    ]
    }
  };

  var wahl = { thema:'dunkel' };
  try { var alt = JSON.parse(localStorage.getItem('fuerte-entwurf') || '{}'); if (alt.thema) wahl.thema = alt.thema; } catch(e){}

  var inst = null;
  function anwenden(){
    document.documentElement.setAttribute('data-theme', wahl.thema === 'hell' ? 'light' : 'dark');
    if (!inst) inst = Meteogramm.einbauen(Object.assign({ ziel:'#wetter-a' }, EINST));
    else inst.zeichnen();
    document.querySelectorAll('.regler button').forEach(function(btn){
      var s = btn.parentNode.getAttribute('data-schalter');
      btn.classList.toggle('is-on', wahl[s] === btn.getAttribute('data-wert'));
    });
    try { localStorage.setItem('fuerte-entwurf', JSON.stringify(wahl)); } catch(e){}
  }
  document.querySelector('.regler').addEventListener('click', function(ev){
    var btn = ev.target.closest('button'); if (!btn) return;
    wahl[btn.parentNode.getAttribute('data-schalter')] = btn.getAttribute('data-wert');
    anwenden();
  });
  anwenden();
</script>
</body>
</html>
